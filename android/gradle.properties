# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KSP registra fontes geradas (Room) via kotlin.sourceSets DSL; o Kotlin embutido
# do AGP 9 rejeita isso por padrão. Esta flag reabilita o comportamento clássico
# (KGP + KSP) — única forma suportada de usar KSP com AGP 9.3 nesta versão.
android.disallowKotlinSourceSets=false
